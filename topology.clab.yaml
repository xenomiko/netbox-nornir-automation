name: netbox-topology

topology:
  nodes:
    ceos1:
      kind: arista_ceos
      image: ceos:4.36.0F
    ceos2:
      kind: arista_ceos
      image: ceos:4.36.0F
    ceos3:
      kind: arista_ceos
      image: ceos:4.36.0F
  links:
    - endpoints: ["ceos1:eth1", "ceos2:eth1"]
    - endpoints: ["ceos2:eth2", "ceos3:eth1"]
    - endpoints: ["ceos3:eth2", "ceos1:eth2"]