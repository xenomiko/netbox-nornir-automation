sites:
  - name: "Containerlab Environment"
    slug: "clab-env"
    status: "active"

manufacturers:
  - name: "Arista"
    slug: "arista"
  - name: "Cisco"
    slug: "cisco"
  - name: "Aruba"
    slug: "aruba"  

platforms:
  - name: "Arista EOS"
    slug: "eos"
    manufacturer: "arista"
  - name: "Cisco IOS"
    slug: "ios"
    manufacturer: "cisco"
  - name: "Aruba AOS-CX"
    slug: "aoscx"
    manufacturer: "aruba"

roles:
  - name: "Virtual Router"
    slug: "virtual-router"
    color: "00bcd4"

device_types:
  - model: "cEOS-LAB"
    slug: "ceos-lab"
    manufacturer: "arista"
    u_height: 1
    is_full_depth: false
  - model: "vIOS"
    slug: "vios"
    manufacturer: "cisco"
    u_height: 1
    is_full_depth: false
  - model: "AOS-CX"
    slug: "aoscx"
    manufacturer: "aruba"
    u_height: 1
    is_full_depth: false

devices:
  - name: "ceos1"
    site: "clab-env"
    device_type: "ceos-lab"
    platform: "eos"
    role: "virtual-router"
    status: "active"

  - name: "ceos2"
    site: "clab-env"
    device_type: "ceos-lab"
    platform: "eos"
    role: "virtual-router"
    status: "active"

  - name: "ceos3"
    site: "clab-env"
    device_type: "ceos-lab"
    platform: "eos"
    role: "virtual-router"
    status: "active"

  - name: "vios1"
    site: "clab-env"
    device_type: "vios"
    platform: "ios"
    role: "virtual-router"
    status: "active"

  - name: "aoscx1"
    site: "clab-env"
    device_type: "aoscx"
    platform: "aoscx"
    role: "virtual-router"
    status: "active"  

interfaces:
  # Management Interfaces
  - device_name: "ceos1"
    name: "eth0"
    type: "virtual"
    mgmt_only: true

  - device_name: "ceos2"
    name: "eth0"
    type: "virtual"
    mgmt_only: true

  - device_name: "ceos3"
    name: "eth0"
    type: "virtual"
    mgmt_only: true

  - device_name: "vios1"
    name: "eth0"
    type: "virtual"
    mgmt_only: true

  - device_name: "aoscx1"
    name: "eth0"
    type: "virtual"
    mgmt_only: true    

  # Data Interfaces
  - device_name: "ceos1"
    name: "eth1"
    type: "1000base-t"
  - device_name: "ceos1"
    name: "eth2"
    type: "1000base-t"
  - device_name: "ceos1"
    name: "eth3"
    type: "1000base-t"

  - device_name: "ceos2"
    name: "eth1"
    type: "1000base-t"
  - device_name: "ceos2"
    name: "eth2"
    type: "1000base-t"
  - device_name: "ceos2"
    name: "eth3"
    type: "1000base-t"

  - device_name: "ceos3"
    name: "eth1"
    type: "1000base-t"
  - device_name: "ceos3"
    name: "eth2"
    type: "1000base-t"

  - device_name: "vios1"
    name: "eth1"
    type: "1000base-t"
  - device_name: "vios1"
    name: "eth2"
    type: "1000base-t"

  - device_name: "aoscx1"
    name: "eth1"
    type: "1000base-t"
  - device_name: "aoscx1"
    name: "eth2"
    type: "1000base-t"  

ip_addresses:
  # vios1
  - address: "172.20.20.2/24"
    status: "active"
    device_name: "vios1"
    interface_name: "eth0"
    is_primary_ip4: true

  - address: "3fff:172:20:20::2/64"
    status: "active"
    device_name: "vios1"
    interface_name: "eth0"
    is_primary_ip6: true

  # aoscx1
  - address: "172.20.20.3/24"
    status: "active"
    device_name: "aoscx1"
    interface_name: "eth0"
    is_primary_ip4: true

  - address: "3fff:172:20:20::3/64"
    status: "active"
    device_name: "aoscx1"
    interface_name: "eth0"
    is_primary_ip6: true

  # ceos2
  - address: "172.20.20.4/24"
    status: "active"
    device_name: "ceos2"
    interface_name: "eth0"
    is_primary_ip4: true

  - address: "3fff:172:20:20::4/64"
    status: "active"
    device_name: "ceos2"
    interface_name: "eth0"
    is_primary_ip6: true

  # ceos3
  - address: "172.20.20.5/24"
    status: "active"
    device_name: "ceos3"
    interface_name: "eth0"
    is_primary_ip4: true

  - address: "3fff:172:20:20::5/64"
    status: "active"
    device_name: "ceos3"
    interface_name: "eth0"
    is_primary_ip6: true

  # ceos1
  - address: "172.20.20.6/24"
    status: "active"
    device_name: "ceos1"
    interface_name: "eth0"
    is_primary_ip4: true

  - address: "3fff:172:20:20::6/64"
    status: "active"
    device_name: "ceos1"
    interface_name: "eth0"
    is_primary_ip6: true

cables:
  - status: "connected"
    a_side:
      device: "ceos1"
      interface: "eth1"
    b_side:
      device: "ceos2"
      interface: "eth1"

  - status: "connected"
    a_side:
      device: "ceos2"
      interface: "eth2"
    b_side:
      device: "ceos3"
      interface: "eth1"

  - status: "connected"
    a_side:
      device: "ceos3"
      interface: "eth2"
    b_side:
      device: "ceos1"
      interface: "eth2"

  - status: "connected"
    a_side:
      device: "vios1"
      interface: "eth1"
    b_side:
      device: "ceos1"
      interface: "eth3"

  - status: "connected"
    a_side:
      device: "aoscx1"
      interface: "eth1"
    b_side:
      device: "ceos2"
      interface: "eth3"

  - status: "connected"
    a_side:
      device: "vios1"
      interface: "eth2"
    b_side:
      device: "aoscx1"
      interface: "eth2"


vlans:
  - vid: 10
    name: USERS
    status: active

  - vid: 20
    name: SERVERS
    status: active

  - vid: 30
    name: MANAGEMENT
    status: active

config_contexts:
  - name: "global-ntp-snmp"
    weight: 100
    description: "NTP and SNMP for all lab devices"
    roles:
      - virtual-router
    data:
      ntp:
        enabled: true
        servers:
          - 10.0.0.1
          - 10.0.0.2
      snmp:
        enabled: true
        communities:
          - public
        servers:
          - 10.0.0.10